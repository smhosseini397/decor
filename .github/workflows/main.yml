name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project
        run: |
          echo "===================================="
          echo "ANDROID PROJECT CHECK"
          echo "===================================="

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Searching for Gradle project..."

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found in repository root."
            echo "This repository may not be an Android Gradle project."
            exit 1
          fi

          echo "gradlew found."

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "===================================="
          echo "GENERATED APK"
          echo "===================================="

          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carpet-decor-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
