name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android project
        run: |
          set -e

          echo "======================================"
          echo "CHECKING ANDROID PROJECT"
          echo "======================================"

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          echo ""
          echo "ANDROID DIRECTORY:"
          find android -maxdepth 3 -type f | sort

          echo ""
          echo "======================================"
          echo "CHECKING GRADLE FILES"
          echo "======================================"

          if [ -f "android/settings.gradle" ]; then
            echo "FOUND: android/settings.gradle"
          fi

          if [ -f "android/settings.gradle.kts" ]; then
            echo "FOUND: android/settings.gradle.kts"
          fi

          if [ -f "android/build.gradle" ]; then
            echo "FOUND: android/build.gradle"
          fi

          if [ -f "android/build.gradle.kts" ]; then
            echo "FOUND: android/build.gradle.kts"
          fi

          if [ -f "android/gradlew" ]; then
            echo "FOUND: android/gradlew"
          fi

          if [ -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "FOUND: android/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android Gradle Wrapper
        working-directory: android
        run: |
          set -e

          echo "======================================"
          echo "GENERATING ANDROID GRADLE WRAPPER"
          echo "======================================"

          gradle wrapper --gradle-version 8.4

          echo ""
          echo "Wrapper files:"
          find gradle/wrapper -maxdepth 1 -type f -print

          echo ""
          echo "Checking wrapper JAR..."

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar was not generated."
            exit 1
          fi

          echo "gradle-wrapper.jar exists."

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Test Gradle Wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carpet-decor-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
