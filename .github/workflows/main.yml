name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Gradle Wrapper
        run: |
          set -e

          echo "Generating Gradle Wrapper..."

          gradle wrapper --gradle-version 8.4

          echo ""
          echo "Wrapper files:"
          find gradle -maxdepth 3 -type f -print

          echo ""
          echo "Checking wrapper JAR..."

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar was not generated."
            exit 1
          fi

          echo "gradle-wrapper.jar exists."

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test Gradle Wrapper
        run: ./gradlew --version

      - name: Check Android project
        run: |
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          echo "Android directory found."

          ls -la android

      - name: Build Android APK
        working-directory: android
        run: ../gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carpet-decor-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
